<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CrudTecnologico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <main id="content">
    <h1>CRUD Tecnológico</h1>
    <p>El fondo es decorativo. Usa el formulario para gestionar productos.</p>

    <section class="card">
      <h2>Formulario de Producto</h2>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="row">
          <label>Nombre</label>
          <input type="text" id="product-name" required>
        </div>
        <div class="row">
          <label>Descripción</label>
          <input type="text" id="product-desc" required>
        </div>
        <div class="row">
          <label>Precio</label>
          <input type="number" id="product-price" step="0.01" required>
        </div>
        <div class="row">
          <label>Categoría</label>
          <input type="text" id="product-cat" required>
        </div>
        <div class="actions">
          <button type="submit" id="save-btn">Guardar</button>
          <button type="button" id="cancel-btn">Limpiar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Lista de Productos</h2>
      <table id="products-table">
        <thead>
          <tr><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Categoría</th><th>Acciones</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="app.js"></script>
</body>
</html>
